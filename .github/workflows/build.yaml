name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.41.5'
  GO_VERSION: '1.24.0'
  JAVA_VERSION: '17'
  NDK_VERSION: '28.0.13004108'
  IS_STABLE: ${{ !contains(github.ref_name, '-') && inputs.prerelease != 'true' }}

jobs:
  # ────────────────────────────────────────────────────────────────
  #  Build jobs (parallel matrix)
  # ────────────────────────────────────────────────────────────────
  build:
    name: Build / ${{ matrix.platform }}${{ matrix.arch && format(' {0}', matrix.arch) || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Android (all ABIs in one job)
          - platform: android
            os: ubuntu-latest

          # Windows x64
          - platform: windows
            os: windows-2022
            arch: amd64

          # Linux x64
          - platform: linux
            os: ubuntu-22.04
            arch: amd64

          # Linux arm64
          - platform: linux
            os: ubuntu-24.04-arm
            arch: arm64

          # macOS Intel
          - platform: macos
            os: macos-15-intel
            arch: amd64

          # macOS Apple Silicon
          - platform: macos
            os: macos-latest
            arch: arm64

    steps:
      # ── Checkout ──────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── Android: signing secrets ──────────────────────────────────
      - name: Setup Android signing
        if: matrix.platform == 'android'
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/app/keystore.jks
          echo "${{ secrets.SERVICE_JSON }}" | base64 --decode > android/app/google-services.json
          {
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "storePassword=${{ secrets.STORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } >> android/local.properties

      # ── Android: Java / SDK / NDK ─────────────────────────────────
      - name: Setup Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        if: matrix.platform == 'android'
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "ndk;${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK=${ANDROID_SDK_ROOT}/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      # ── Go ────────────────────────────────────────────────────────
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      # ── Flutter (stable for all except ubuntu-24.04-arm) ──────────
      - name: Setup Flutter
        if: ${{ !startsWith(matrix.os, 'ubuntu-24.04-arm') }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Flutter (master channel – ARM Linux)
        if: startsWith(matrix.os, 'ubuntu-24.04-arm')
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      # ── Build ─────────────────────────────────────────────────────
      - name: Build
        run: >
          dart setup.dart ${{ matrix.platform }}
          ${{ matrix.arch && format('--arch {0}', matrix.arch) || '' }}
          ${{ env.IS_STABLE == 'true' && '--env stable' || '' }}

      # ── Upload dist/ ──────────────────────────────────────────────
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }}
          path: dist/
          if-no-files-found: error
          overwrite: true

  # ────────────────────────────────────────────────────────────────
  #  Release job – runs after all builds succeed
  # ────────────────────────────────────────────────────────────────
  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Merge all platform artifacts into dist/ ───────────────────
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: dist-*
          merge-multiple: true

      - name: List dist contents
        run: find dist/ -type f | sort

      # ── SHA-256 checksums ─────────────────────────────────────────
      - name: Generate SHA256 checksums
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name '*.sha256' | while IFS= read -r f; do
            sha256sum "$f" > "${f}.sha256"
            echo "  $(cat "${f}.sha256")"
          done

      # ── Release body ──────────────────────────────────────────────
      - name: Prepare release notes
        id: notes
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Expand VERSION placeholder in template
          sed "s/VERSION/$VERSION/g" .github/release_template.md > release_body.md
          # Append manual release notes if present
          if [ -f release.md ]; then
            printf '\n---\n\n' >> release_body.md
            cat release.md >> release_body.md
          fi

      # ── Create GitHub Release and upload assets ───────────────────
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release_body.md
          prerelease: ${{ env.IS_STABLE != 'true' }}
          generate_release_notes: false
          fail_on_unmatched_files: false
          files: |
            dist/**

      # ── Update manifest (stable only) ────────────────────────────
      - name: Generate update manifest
        if: env.IS_STABLE == 'true'
        env:
          TAG: ${{ github.ref_name }}
          DIST_DIR: dist
          RELEASE_NOTES_FILE: release.md
          UPDATE_ASSET_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: python generate_update_manifest.py

      # ── Telegram notification (opt-in via repo variable) ──────────
      - name: Notify Telegram
        if: vars.TELEGRAM_NOTIFY == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TAG: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          pip install --quiet requests
          python release_telegram.py
