name: build

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.41.5'
  GO_VERSION: '1.24.0'
  JAVA_VERSION: '17'
  NDK_VERSION: '28.0.13004108'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Regenerate source files
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze project
        run: flutter analyze --no-fatal-infos lib setup.dart

      - name: Validate release automation scripts
        run: python -m py_compile release_telegram.py generate_update_manifest.py

      - name: Verify generated files are committed
        run: git diff --exit-code

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Android APK
        run: dart setup.dart android --env stable

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-dist
          path: dist
          if-no-files-found: error

  build-windows:
    name: Build Windows ${{ matrix.arch }}
    runs-on: windows-2022
    needs: analyze
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
          - arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Windows package
        run: dart setup.dart windows --arch ${{ matrix.arch }} --env stable

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}-dist
          path: dist
          if-no-files-found: error

  build-linux:
    name: Build Linux amd64
    runs-on: ubuntu-22.04
    needs: analyze
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Linux package
        run: dart setup.dart linux --arch amd64 --env stable

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64-dist
          path: dist
          if-no-files-found: error

  build-macos:
    name: Build macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    needs: analyze
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: amd64
          - os: macos-latest
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build macOS package
        run: dart setup.dart macos --arch ${{ matrix.arch }} --env stable

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-dist
          path: dist
          if-no-files-found: error

  release:
    name: Release
    runs-on: ubuntu-latest
    needs:
      - build-android
      - build-windows
      - build-linux
      - build-macos
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all
          merge-multiple: false

      - name: Merge artifacts into dist/
        run: |
          mkdir -p dist
          find dist-all -type f | while read -r f; do
            cp "$f" dist/
          done
          echo "Files in dist/:"
          ls -lh dist/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate update manifest and SHA256 checksums
        env:
          TAG: ${{ github.ref_name }}
          DIST_DIR: dist
          RELEASE_NOTES_FILE: release.md
          UPDATE_ASSET_BASE_URL: ${{ secrets.UPDATE_ASSET_BASE_URL }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          UPDATE_FORCE: ${{ secrets.UPDATE_FORCE }}
        run: python generate_update_manifest.py

      - name: Install AWS CLI
        run: pip install awscli

      - name: Sync dist to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          if [[ -z "$S3_ENDPOINT" || -z "$S3_BUCKET" ]]; then
            echo "S3 not configured, skipping upload."
            exit 0
          fi
          aws s3 sync dist/ "s3://${S3_BUCKET}/" \
            --endpoint-url "${S3_ENDPOINT}" \
            --no-progress

      - name: Build release body
        id: release_body
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          sed "s/VERSION/${VERSION}/g" .github/release_template.md > release_body.md
          if [[ -f release.md ]]; then
            printf '\n' >> release_body.md
            cat release.md >> release_body.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release_body.md
          files: |
            dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Telegram dependencies
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' }}
        run: pip install requests

      - name: Send Telegram notification
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' }}
        env:
          TAG: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          DIST_DIR: dist
        run: python release_telegram.py
